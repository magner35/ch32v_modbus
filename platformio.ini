; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed, extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples:
; https://docs.platformio.org/page/projectconf.html

; ── Обее для всех сборок CH32V003 (16K/2K, порт D/C тот же в любом корпусе) ─
[ch32v003_common]
platform = ch32v
framework = noneos-sdk
upload_protocol = wlink

board_build.f_cpu = 48000000L

; последняя страница 1К (0x08003C00) зарезервирована под журнал критических
; данных — прошивка должна оставаться ниже 15360 Б, иначе линковка упадёт
board_upload.maximum_size = 15360

build_flags =
    -Os
    -Isrc
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

; после сборки: регенерация modbuspoll_ireg.mbp из карты IREG
; доп. цели upload_keep и journal_dump (см. tools/keep_upload.py)
extra_scripts =
    pre:tools/keep_upload.py
    post:tools/gen_modbus_poll.py

; ── Отладочная плата EVT-R0, CH32V003F4P6 (TSSOP20), кварц + PLL ────────────
[env:ch32v003f4p6_evt_r0]
extends = ch32v003_common
board = ch32v003f4p6_evt_r0
board_build.clock_source = hse+pll

; ── Заливка с контролем сохранности пользовательского региона flash ────────
; Upload шьёт через wlink flash (стирает только записываемые страницы,
; в отличие от openocd program с полным стиранием чипа) и после заливки
; печатает первую запись журнала: магика "CRIT" = счётчики/настройки живы.
; Путь к wlink.exe при переезде проекта на другую машину поправить.
[env:ch32v003f4p6_evt_r0_keep]
extends = ch32v003_common
board = ch32v003f4p6_evt_r0
board_build.clock_source = hse+pll
upload_protocol = custom
upload_command = "C:/Users/user/.platformio/packages/tool-wlink/wlink.exe" flash "$SOURCE" && "C:/Users/user/.platformio/packages/tool-wlink/wlink.exe" dump 0x08003C00 64

; ── Своя плата на CH32V003F4U6 (QFN20): порты те же, код идентичен ──────────
; Тактирование от HSI (без кварца); если на плате кварц — поставить hse+pll.
; Распиновка QFN20: VDD=6, VSS=4, PD1/SWIO=15, PD2(LED2)=16, PD3(LED1)=17,
; PD4(вход импульсов TIM2_CH1)=18, PD5(TX)=19, PD6(RX)=20, PC3(DE)=10,
; PC4(GEN_OUT)=11, PD0=5, PC0..PC2=7..9, PC5..PC7=12..14, PA1/PA2=2/3.
[env:ch32v003f4u6]
extends = ch32v003_common
board = genericCH32V003F4U6
board_build.clock_source = hsi+pll
