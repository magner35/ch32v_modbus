; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ch32v003f4p6_evt_r0]
platform = ch32v
board = ch32v003f4p6_evt_r0
framework = noneos-sdk

board_build.clock_source = hse+pll
board_build.f_cpu = 48000000L

; последняя страница 1К (0x08003C00) зарезервирована под журнал критических
; данных — прошивка должна оставаться ниже 15360 Б, иначе линковка упадёт
board_upload.maximum_size = 15360

build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections


[env:ch32v003j4m6]
platform = ch32v
board = genericCH32V003J4M6
framework = noneos-sdk

board_build.clock_source = hsi+pll
board_build.f_cpu = 48000000L

build_flags =
    -Wstrict-aliasing=3
; -D SDI_PRINT=SDI_PR_OPEN


